# =============================================================================
# .github/workflows/terraform.yml
#
# GitOps pipeline for the iac-vprofile repository.
#   - push to stage → init, fmt, validate, plan
#   - PR to main    → same plan (so the reviewer can read it)
#   - push to main  → init, fmt, validate, plan, AND apply
#
# Auth is via OIDC — no static AWS keys in GitHub Secrets.
# =============================================================================

name: "Vprofile IAC"

on:
  push:
    branches:
      - main
      - stage
    paths:
      - terraform/**
  pull_request:
    branches:
      - main
    paths:
      - terraform/**

permissions:
  id-token: write   # required for the OIDC token request
  contents: read    # required for actions/checkout

env:
  AWS_ROLE_ARN:    ${{ secrets.AWS_ROLE_ARN }}
  AWS_REGION:      ${{ secrets.AWS_REGION }}
  BUCKET_TF_STATE: ${{ secrets.BUCKET_TF_STATE }}

jobs:
  terraform:
    name: "Apply Terraform code changes"
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: ./terraform   # cd into terraform/ for every step

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region:     ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        id: init
        run: terraform init -backend-config="bucket=$BUCKET_TF_STATE"

      - name: Terraform format check
        id: fmt
        run: terraform fmt -check

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false -out planfile
        continue-on-error: true

      - name: Terraform plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

      # Class 2 addition — the apply step.
      # Only runs on direct push to main (the post-merge state).
      # NOT on stage pushes, NOT on PR triggers — those should never apply.
      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false -parallelism=1 planfile
